<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Himer65</title>
    <link rel="icon" href="../../resume/image/himer.png">

    <!-- Подключение chessboard.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <!-- Подключение шрифта -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: "Roboto", sans-serif;
        }

        #conteiner{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 440px;
        }

        #startButton{
            border: 0;
            border-radius: 10px;
            padding: 10px 20px;
            margin-top: 10px;
            background: rgb(55, 55, 255);
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="conteiner">
        <h2>PlanktonAI</h2>
        <div id="board"></div>
        <button id="startButton" type="button">Заново</button>
    </div>

    <!-- Подключение jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <!-- Подключение chessboard.js -->
    <script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <!-- Подключение chess.js -->
    <script src="https://cdn.jsdelivr.net/npm/chess.js@0.12.1/chess.min.js"></script>
    <!-- Подключение ONNX Runtime-->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
