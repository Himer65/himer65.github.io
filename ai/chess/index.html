<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanktonAI — шахматы</title>
    <link rel="icon" href="../../resume/image/himer.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 12px;
            background: #f4f6f8;
            color: #20252b;
            font-family: Arial, sans-serif;
        }
        #container { width: min(92vw, 440px); text-align: center; }
        #board { width: 100%; margin: 16px auto; }
        #status { min-height: 2.8em; margin: 12px 0; color: #39434e; }
        #startButton {
            border: 0; border-radius: 9px; padding: 10px 20px;
            background: #3676ff; color: white; font-size: 16px; cursor: pointer;
        }
        #startButton:disabled { opacity: .6; cursor: wait; }
        .hint { color: #697586; font-size: 13px; line-height: 1.4; }
    </style>
</head>
<body>
    <main id="container">
        <h2>PlanktonAI</h2>
        <div id="status" role="status" aria-live="polite">Загрузка нейросети…</div>
        <div id="board" aria-label="Шахматная доска"></div>
        <button id="startButton" type="button" disabled>Заново</button>
        <p class="hint">Вы играете белыми. Ходы PlanktonAI вычисляются в браузере.</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chess.js@0.12.1/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@latest/dist/ort.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
